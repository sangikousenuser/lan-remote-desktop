[package]
name = "lrd-network-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lrd-session = { path = "../../crates/lrd-session" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
cap-std = "=3.4.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
