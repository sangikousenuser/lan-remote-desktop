[package]
name = "lrd-windows-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lrd-common = { path = "../../crates/lrd-common" }
lrd-session = { version = "0.9.0-alpha.1", path = "../../crates/lrd-session" }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
image = { version = "=0.25.9", default-features = false, features = ["png", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
