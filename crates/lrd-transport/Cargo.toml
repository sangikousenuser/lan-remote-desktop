[package]
name = "lrd-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lrd-session = { path = "../lrd-session" }
lrd-protocol = { path = "../lrd-protocol" }
lrd-common = { path = "../lrd-common" }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
ring = "=0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
