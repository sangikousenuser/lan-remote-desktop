name: Release Candidate Build
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-host-alpha
          path: inputs/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: intel-macos-client-alpha
          path: inputs/macos
      - name: Build signer without secrets
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo build --locked --release -p lrd-session --example lrd-release-tool
      - name: Prepare exact update members and provenance
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 packaging/release/pipeline.py prepare --root inputs --output prepared --version "$VERSION" --signer target/release/examples/lrd-release-tool
          cat prepared/inventory.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-prepared
          path: prepared/
          if-no-files-found: error
          retention-days: 30
