name: Alpha Candidate Build (NOT a Stable release)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build-rc:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2025
            artifact: windows-host-alpha
            executable: dist/LAN-Remote-Desktop-Windows-*
          - os: macos-15-intel
            artifact: intel-macos-client-alpha
            executable: dist/x86_64-apple-darwin/
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: python3 packaging/macos/package.py
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Package Windows Host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          python3 packaging/windows/package.py --binary target/release/lrd-windows-host.exe --installer
      - name: Upload alpha artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 7
