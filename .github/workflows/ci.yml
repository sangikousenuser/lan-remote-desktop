name: Rust CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust + components
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: Packaging gate tests
        run: python3 -m unittest discover -s packaging/macos -p 'test_*.py'
      - name: Compile release applications
        run: cargo build --locked --workspace --release
      - name: Package and inspect Intel macOS app
        if: runner.os == 'macOS'
        run: python3 packaging/macos/package.py
      - name: Upload Intel client alpha
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intel-macos-client-alpha
          path: dist/x86_64-apple-darwin/
          if-no-files-found: error
