name: Rust CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust + components
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --workspace
        env:
          LRD_ENCODER_FIXTURE: ${{ runner.temp }}/lrd-first-frame.h264
      - name: Upload synthetic Windows codec fixture
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-software-codec-fixture
          path: |
            ${{ runner.temp }}/lrd-first-frame.h264
            ${{ runner.temp }}/lrd-first-frame.json
          if-no-files-found: error
      - name: Packaging gate tests
        run: python3 -m unittest discover -s packaging/macos -p 'test_*.py'
      - name: Compile release applications
        run: cargo build --locked --workspace --release
      - name: Initialize Windows process and enumerate Ethernet
        if: runner.os == 'Windows'
        run: target/release/lrd-windows-host.exe --interfaces
      - name: Compare transport candidates on loopback
        run: cargo run --locked --release -p lrd-transport --example transport-compare -- --loopback --samples 120 --output target/transport-loopback.json
      - name: Upload numeric transport comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transport-loopback-${{ matrix.os }}
          path: target/transport-loopback.json
          if-no-files-found: error
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Package Windows Host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          python3 packaging/windows/package.py --binary target/release/lrd-windows-host.exe --installer
      - name: Upload Windows Host alpha
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-host-alpha
          path: |
            dist/LAN-Remote-Desktop-Windows-Host.zip
            dist/LAN-Remote-Desktop-Windows-Setup.exe
            dist/windows-SHA256SUMS
          if-no-files-found: error
      - name: Package and inspect Intel macOS app
        if: runner.os == 'macOS'
        run: python3 packaging/macos/package.py
      - name: Upload Intel client alpha
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intel-macos-client-alpha
          path: dist/x86_64-apple-darwin/
          if-no-files-found: error

  cross-os-codec:
    name: Windows MFT to macOS VideoToolbox
    needs: verify
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-software-codec-fixture
          path: ${{ runner.temp }}
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Decode this run's Windows H.264 on macOS
        run: cargo test --locked -p lrd-macos-client network::tests::windows_software_mft_frame_decodes_on_mac -- --ignored --exact
        env:
          LRD_EXTERNAL_H264_FIXTURE: ${{ runner.temp }}/lrd-first-frame.h264
